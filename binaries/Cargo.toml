[package]
name = "binaries"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
server = { path = "../server" }
env_logger = "0.11.10"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.32"
tokio-tungstenite = { version = "0.27.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
clap = { version = "4.6.1", features = ["derive"] }
mimalloc = "0.1.52"
rustls = { version = "0.23", features = ["ring"] }

[lints]
workspace = true