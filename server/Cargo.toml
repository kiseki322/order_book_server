[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
axum = { version = "0.8.9" }
tokio = { version = "1", features = ["full"] }
log = "0.4"
notify = "8.2.0"
slab = "0.4"
itertools = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3.32"
rayon = "1.12"
alloy = { version = "1.8.3", default-features = false, features = ["essentials", "provider-http", "reqwest", "reqwest-rustls-tls"] }
strum_macros = "0.27.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
yawc = { version = "0.2.7", features = ["axum"] }
sonic-rs = "0.5.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
